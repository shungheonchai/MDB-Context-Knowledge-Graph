[project]
name = "context-knowledge-graph-runtime"
version = "0.1.0"
description = "Portable claim-led LangGraph agents and shared business context explorer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-dotenv>=1,<2",
  "pymongo>=4.11,<5", "dnspython>=2.7,<3", "langgraph>=1,<2",
  "langchain-openai>=1.1,<2",
  "agent-engine-sdk-memory>=0.11.3,<1", "httpx>=0.28,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mongomock>=4.3,<5"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/context_knowledge_graph"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-select = []
